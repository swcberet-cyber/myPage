<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="당신의 이름으로 시작하는 따뜻한 환영 인사." />
    <title>반가워요 · 나를 위한 첫 인사</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #253b32; background: #f6f7f2; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; display: flex; flex-direction: column; }
      header { padding: 30px clamp(24px, 7vw, 100px); font-size: 18px; font-weight: 750; letter-spacing: -.7px; }
      .brand-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #548369; margin-right: 9px; }
      main { flex: 1; display: grid; place-items: center; padding: 30px 24px 70px; }
      .card { width: 100%; max-width: 520px; padding: 48px; background: #fff; border: 1px solid #e3e8df; border-radius: 28px; box-shadow: 0 18px 70px #314e3810; }
      .symbol { display: grid; place-items: center; width: 64px; height: 64px; margin-bottom: 30px; background: #edf3e9; border-radius: 22px; font-size: 30px; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #738b79; }
      h1 { font-size: clamp(28px, 6vw, 36px); line-height: 1.35; letter-spacing: -1.5px; margin: 14px 0; }
      .intro { color: #7b847d; font-size: 15px; line-height: 1.8; margin: 0 0 32px; }
      label { display: block; margin-bottom: 10px; font-size: 13px; font-weight: 650; }
      input { width: 100%; min-height: 54px; padding: 14px 16px; border: 1px solid #dce3d9; border-radius: 12px; font: inherit; color: #253b32; background: #fbfcf9; }
      input::placeholder { color: #a0aaa1; }
      input:focus-visible { outline: 3px solid #a9c4aa; outline-offset: 3px; }
      button { width: 100%; min-height: 54px; margin-top: 14px; border: 0; border-radius: 12px; background: #365b46; color: #fff; font: inherit; font-size: 15px; font-weight: 650; cursor: pointer; transition: background .2s; }
      button:hover { background: #284936; }
      button:focus-visible { outline: 3px solid #89ac8d; outline-offset: 3px; }
      .result { margin: 24px 0 0; padding: 18px; border-radius: 12px; background: #edf3e9; font-size: 18px; line-height: 1.7; font-weight: 650; text-align: center; overflow-wrap: anywhere; }
      .result:empty { display: none; }
      .note { margin: 24px 0 0; text-align: center; font-size: 12px; color: #929a92; }
      footer { padding: 0 24px 26px; text-align: center; font-size: 12px; color: #939c92; }
      @media (max-width: 480px) { .card { padding: 32px 24px; } header { padding-top: 24px; } }
    </style>
  </head>
  <body>
    <header><span class="brand-dot" aria-hidden="true"></span>반가워요</header>
    <main>
      <section class="card" aria-labelledby="title">
        <div class="symbol" aria-hidden="true">🌿</div>
        <span class="eyebrow">A LITTLE HELLO FOR YOU</span>
        <h1 id="title">당신을 만나서 반가워요.</h1>
        <p class="intro">어떤 이름으로 불러드릴까요?<br />이름을 알려주시면 따뜻하게 맞이할게요.</p>
        <form id="welcome-form">
          <label for="name">이름</label>
          <input id="name" name="name" type="text" placeholder="이름을 입력해주세요" autocomplete="name" maxlength="80" required />
          <button type="submit">인사 나누기 <span aria-hidden="true">→</span></button>
        </form>
        <p id="greeting" class="result" role="status" aria-live="polite" aria-atomic="true"></p>
        <p class="note">입력한 이름은 저장되지 않아요.</p>
      </section>
    </main>
    <footer>작은 인사로 시작하는 좋은 하루.</footer>
    <script>
      const form = document.getElementById('welcome-form');
      const nameInput = document.getElementById('name');
      const greeting = document.getElementById('greeting');

      nameInput.addEventListener('input', () => nameInput.setCustomValidity(''));
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const name = nameInput.value.trim();
        if (!name) {
          nameInput.setCustomValidity('이름을 입력해주세요.');
          nameInput.reportValidity();
          return;
        }
        greeting.textContent = `${name} 님 어서오세요`;
      });
    </script>
  </body>
</html>
